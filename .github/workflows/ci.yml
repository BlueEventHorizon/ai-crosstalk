name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: manifest check + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify python3
        run: python3 --version

      - name: Validate JSON manifests
        run: |
          set -euo pipefail
          for f in .claude-plugin/marketplace.json crosstalk/.claude-plugin/plugin.json; do
            echo "validate: $f"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: crosstalk unit tests
        working-directory: crosstalk/skills/crosstalk/scripts
        run: python3 -m unittest discover -s tests -t .
